function esc(s){return safeText(s,15000).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(s){return esc(s||'（尚未填寫）').replace(/\n/g,'<br>')}
function normalize(raw){const fresh=createState();if(!raw||typeof raw!=='object')return fresh;fresh.meta.name=safeText(raw.meta?.name,60);fresh.meta.date=safeText(raw.meta?.date,20)||localDay();fresh.l1.hypothesis=safeText(raw.l1?.hypothesis,2000);fresh.l1.reflection=safeText(raw.l1?.reflection,2000);fresh.l1.conclusion=safeText(raw.l1?.conclusion,2000);if(Array.isArray(raw.l1?.items)){const arr=raw.l1.items.slice(0,60).filter(x=>x&&typeof x==='object').map((x,i)=>({id:safeText(x.id||'custom'+i,90),name:safeText(x.name,80),icon:safeText(x.icon||'🧩',4),material:safeText(x.material,100),reference:safeText(x.reference,400),prediction:['yes','no',''].includes(x.prediction)?x.prediction:'',actual:['yes','no',''].includes(x.actual)?x.actual:'',note:safeText(x.note,400),custom:!!x.custom}));if(arr.length)fresh.l1.items=arr}fresh.l2.prediction=safeText(raw.l2?.prediction,50);fresh.l2.fair=[0,1,2].map(i=>!!raw.l2?.fair?.[i]);fresh.l2.measure=[0,1,2].map(i=>[0,1,2].map(j=>{const n=safeText(raw.l2?.measure?.[i]?.[j],3);return /^\d{1,3}$/.test(n)&&Number(n)<=999?n:''}));fresh.l2.notes=safeText(raw.l2?.notes,2000);fresh.l2.conclusion=safeText(raw.l2?.conclusion,2000);fresh.l3.demoPair=PAIRS.includes(raw.l3?.demoPair)?raw.l3.demoPair:'NN';fresh.l3.demoPrediction=['attract','repel',''].includes(raw.l3?.demoPrediction)?raw.l3.demoPrediction:'';fresh.l3.demoReveal=!!raw.l3?.demoReveal;fresh.l3.records=PAIRS.map(p=>{const r=raw.l3?.records?.find?.(x=>x?.pair===p)||{};return {pair:p,prediction:['attract','repel',''].includes(r.prediction)?r.prediction:'',actual:['attract','repel',''].includes(r.actual)?r.actual:'',note:safeText(r.note,400)}});fresh.l3.conclusion=safeText(raw.l3?.conclusion,2000);for(const l of [1,2,3]){const x=raw.quiz?.[l];if(x&&typeof x==='object'){fresh.quiz[l].submitted=!!x.submitted;for(const [k,v] of Object.entries(x.answers||{})){if(/^\d+$/.test(k)&&+k<QUIZZES[l].length&&Number.isInteger(v)&&v>=0&&v<=3)fresh.quiz[l].answers[k]=v}}}const lesson=Number(raw.ui?.lesson);const step=Number(raw.ui?.step);fresh.ui.lesson=[1,2,3,4].includes(lesson)?lesson:1;fresh.ui.step=Number.isInteger(step)&&step>=0&&step<=3?step:0;return fresh}
let state;try{state=normalize(JSON.parse(localStorage.getItem(STORAGE_KEY)))}catch(e){state=createState()}
let showRefs=false;let toastTimeout;
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch(e){ /* 可仍透過下載 JSON 手動保存 */ }}
function notify(message){const t=document.getElementById('toast');t.textContent=message;t.classList.remove('hide');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>t.classList.add('hide'),2800)}
function setPage(lesson,step=0){state.ui.lesson=lesson;state.ui.step=step;save();render();window.scrollTo({top:0,behavior:'smooth'})}
function progress(){let total=0,done=0;for(const x of state.l1.items){total+=2;if(x.prediction)done++;if(x.actual)done++}total+=2;if(state.l1.hypothesis.trim())done++;if(state.l1.conclusion.trim())done++;total+=1+9+1;if(state.l2.prediction)done++;for(const row of state.l2.measure)for(const v of row)if(v!=='')done++;if(state.l2.conclusion.trim())done++;total+=4*2+1;for(const x of state.l3.records){if(x.prediction)done++;if(x.actual)done++}if(state.l3.conclusion.trim())done++;for(const l of [1,2,3]){total+=4;done+=Object.keys(state.quiz[l].answers).length}return Math.round(done/total*100)}

function bottomNav(lesson,step){return `<div class="actions"><div>${step>0?`<button class="btn secondary" data-step="${step-1}">← 上一步</button>`:`<button class="btn secondary" data-page="${lesson===1?4:lesson-1}">← ${lesson===1?'成果中心':'上一節課'}</button>`}</div><div>${step===3?`<button class="btn purple" data-page="${lesson===3?4:lesson+1}">${lesson===3?'查看全部成果':'進入下一節課'} →</button>`:`<button class="btn" data-step="${step+1}">下一步 →</button>`}</div></div>`}
function selectOptions(value,options,extra=''){return `<select ${extra}><option value="">— 請選擇 —</option>${options.map(([v,label])=>`<option value="${esc(v)}" ${value===v?'selected':''}>${esc(label)}</option>`).join('')}</select>`}
function radio(name,value,choices){return `<div class="options">${choices.map(([v,t])=>`<label class="option"><input type="radio" name="${esc(name)}" value="${esc(v)}" ${value===v?'checked':''}><span>${esc(t)}</span></label>`).join('')}</div>`}

function lesson1(step){let content='';const x=state.l1;if(step===0){content=`<div class="badge">🔬 任務 01｜提出問題與推測</div>${materialFigure()}<p class="story">磁鐵可以吸住迴紋針，也能把便條紙固定在鐵製冰箱門上。可是，<strong>是不是所有東西都會被磁鐵吸住呢？</strong></p><div class="card peach"><strong>🧐 小偵探的任務</strong><p>仔細看物品的材質，先猜一猜，再用真實磁鐵來找證據。猜錯也沒關係，實驗就是來解開問題的！</p></div><div class="field"><label for="l1-hypothesis">我的想法：我猜哪些東西會被吸住？為什麼？</label><textarea id="l1-hypothesis" data-input="l1.hypothesis" placeholder="例如：我覺得……因為……">${esc(x.hypothesis)}</textarea></div><div class="callout">安全提醒：請老師確認測試物品；不要拿磁鐵靠近手機、電腦等電子設備，也不要用尖銳物品玩耍。</div>`}
if(step===1){content=`<div class="badge">🧲 任務 02｜預測 × 實測 × 紀錄</div><h3>把磁鐵帶到物品旁，看看自己的預測準不準！</h3><p class="sidenote">每件物品先選「我的推測」，再用實物測試，最後填寫「實際結果」。材質可依手上的物品修改。</p><div class="object-grid">${x.items.map(item=>`<section class="item-card"><div class="item-head"><span class="item-name"><span class="item-emoji">${esc(item.icon)}</span> ${esc(item.name)}</span>${item.custom?`<button class="btn small warn" data-delete-item="${esc(item.id)}" aria-label="刪除${esc(item.name)}">刪除</button>`:''}</div><div><label class="small-label" for="material-${esc(item.id)}">材料／材質</label><input id="material-${esc(item.id)}" type="text" data-item-id="${esc(item.id)}" data-item-field="material" value="${esc(item.material)}" maxlength="100" placeholder="觀察或推測材質"></div><div class="mini"><div><label class="small-label">我的推測</label>${selectOptions(item.prediction,[['yes','會吸住'],['no','不會吸住']],`aria-label="${esc(item.name)}的推測" data-item-id="${esc(item.id)}" data-item-field="prediction"`)}</div><div><label class="small-label">實際結果</label>${selectOptions(item.actual,[['yes','吸住了'],['no','沒吸住']],`aria-label="${esc(item.name)}的實際結果" data-item-id="${esc(item.id)}" data-item-field="actual"`)}</div></div><label class="small-label">觀察備註（可不填）<input type="text" data-item-id="${esc(item.id)}" data-item-field="note" maxlength="400" value="${esc(item.note)}" placeholder="例如：只有金屬部分吸住"></label>${item.actual?`<span class="badge" style="background:${item.prediction&&((item.prediction===item.actual))?'#e7f7ef':'#f0f2ff'};color:#47618d">${item.prediction?(item.prediction===item.actual?'✓ 推測一致':'✦ 發現新線索'):'✓ 已記錄實測'}</span>`:''}</section>`).join('')}</div><div class="card lav"><h3>➕ 我要增加其他測試物品</h3><div class="new-item"><div class="field"><label for="extraName">物品名稱</label><input id="extraName" data-input="l1.extraName" type="text" value="${esc(x.extraName)}" placeholder="例如：鑰匙" maxlength="80"></div><div class="field"><label for="extraMaterial">可能材質</label><input id="extraMaterial" data-input="l1.extraMaterial" type="text" value="${esc(x.extraMaterial)}" placeholder="例如：金屬" maxlength="100"></div><button class="btn green" id="add-item">＋ 加入測試</button></div><p class="sidenote">新物品可以無限次加入（單次最多保存60項）；結果沒有預設答案，請以實物為準。</p></div><details ${showRefs?'open':''}><summary>📘 查看教科書中的常見參考現象</summary><p class="sidenote">這不是實驗答案鍵。不同材質的剪刀、長尾夾與金屬物品可能表現不同。</p>${x.items.filter(i=>!i.custom).map(i=>`<p><strong>${esc(i.name)}：</strong>${esc(i.reference)}</p>`).join('')}</details><div class="field"><label for="l1-reflect">有哪一個結果最讓你驚訝？</label><textarea id="l1-reflect" data-input="l1.reflection" placeholder="我原本以為……可是實際……">${esc(x.reflection)}</textarea></div>`}
if(step===2){content=quizSection(1)}
if(step===3){const yes=x.items.filter(a=>a.actual==='yes').map(a=>a.name);const no=x.items.filter(a=>a.actual==='no').map(a=>a.name);content=`<div class="badge">✨ 任務 04｜用自己的話說明</div><div class="card mint"><h3>🧠 今天學到的科學知識</h3><p><strong>磁鐵能吸住鐵製品。</strong>不是所有金屬都一定能被磁鐵吸住，和材料的性質有關。</p><p>磁力也可以隔著薄紙、塑膠袋等非磁性物品發生作用。</p></div><div class="grid2"><div class="card"><h3>✅ 我實測能吸住</h3><p>${yes.length?esc(yes.join('、')):'還沒有填入實驗結果'}</p></div><div class="card"><h3>⭕ 我實測沒吸住</h3><p>${no.length?esc(no.join('、')):'還沒有填入實驗結果'}</p></div></div><div class="field"><label for="l1-conc">我的科學結論（請用自己的話寫）</label><textarea id="l1-conc" data-input="l1.conclusion" placeholder="實驗之後，我發現……">${esc(x.conclusion)}</textarea></div><div class="callout">科學家小提醒：這裡是<strong>教材知識</strong>加上<strong>你自己的證據</strong>。實驗和教科書結果不同，也請照實記錄。</div>`}
return content}
function validNumber(v){return v!==''&&/^\d+$/.test(String(v))&&Number(v)<=999}
function completedTrials(){return state.l2.measure.filter(row=>row.every(validNumber)).map(row=>row.map(Number))}
function chartHTML(){const data=completedTrials();if(!data.length)return `<div class="card dark"><h3>📊 磁力數據圖表</h3><p>完成至少一輪三個位置的數量紀錄後，這裡就會長出你的實驗圖表！</p></div>`;const avg=[0,1,2].map(j=>data.reduce((acc,r)=>acc+r[j],0)/data.length);const max=Math.max(1,...avg);const colors=['red','gray','blue'];return `<div class="card dark"><h3>📊 你測出的磁力強弱</h3><p class="sidenote">已完成 ${data.length} 輪；下圖比較各位置平均吸起的迴紋針數量，並非磁力的正式單位。</p><div class="chart" role="img" aria-label="N極${avg[0].toFixed(1)}、中間${avg[1].toFixed(1)}、S極${avg[2].toFixed(1)}個迴紋針的長條圖">${avg.map((v,i)=>`<div class="bar-group"><div class="bar-value">${v.toFixed(1)}</div><div class="bar ${colors[i]}" style="height:${Math.round(v/max*152)+4}px"></div><div class="bar-label">${['N極','中間','S極'][i]}</div></div>`).join('')}</div><p class="sidenote" style="margin-top:42px">數據說明：${avg[0]>avg[1]&&avg[2]>avg[1]?'你這次的結果顯示兩端平均吸住的數量比中間多。':'這次的數據未明顯呈現兩端都較強；可以再測量、檢查操作是否一致。'}</p></div>`}

if(step===2){content=quizSection(2)}

return content}
function poleMag(side,pole){const other=pole==='N'?'S':'N';const left=side==='left'?other:pole;const right=side==='left'?pole:other;return `<div class="mag" aria-label="${left}極和${right}極"><span class="${left==='N'?'red':'blue'}">${left}</span><span class="${right==='N'?'red':'blue'}">${right}</span></div>`}
function lesson3(step){const x=state.l3;let content='';if(step===0){const pair=x.demoPair,repel=pair[0]===pair[1];content=`<div class="badge">⚡ 任務 01｜磁極的神祕力量</div><p class="story">把兩塊磁鐵慢慢靠近，會發現：<strong>有時它們想靠在一起，有時卻彼此推開！</strong></p><div class="field"><label for="demo-pair">選擇哪兩個磁極互相靠近</label><select id="demo-pair" data-demo="pair"><option value="NN" ${pair==='NN'?'selected':''}>N 極對 N 極</option><option value="NS" ${pair==='NS'?'selected':''}>N 極對 S 極</option><option value="SN" ${pair==='SN'?'selected':''}>S 極對 N 極</option><option value="SS" ${pair==='SS'?'selected':''}>S 極對 S 極</option></select></div><div class="pair-area"><div class="magnet-scene ${x.demoReveal?(repel?'move-apart':'move-together'):''}">${poleMag('left',pair[0])}${poleMag('right',pair[1])}</div><div class="motion-text">${x.demoReveal?(repel?'↔ 相同磁極：互相排斥':'→ ← 不同磁極：互相吸引'):'❔ 猜猜磁鐵會怎麼動？'}</div></div><div class="field"><label>先猜一猜</label>${radio('l3-demo-pred',x.demoPrediction,[['attract','互相吸引'],['repel','互相排斥']])}</div><button id="play-demo" class="btn" ${x.demoPrediction?'':'disabled'}>▶ 觀看磁極作用示意</button>${x.demoReveal?`<div class="card mint"><strong>${x.demoPrediction===(repel?'repel':'attract')?'🎉 猜對了！':'🌱 發現新的現象！'}</strong><p>${repel?'相同磁極會互相排斥。':'不同磁極會互相吸引。'} 圖片只示範作用方向，不是實測紀錄。</p></div>`:''}<div class="callout">請記住：動畫是<strong>磁力原理示意</strong>，真實實驗還是要用兩塊磁鐵親自驗證。</div>`}
if(step===1){content=`<div class="badge">🧲 任務 02｜四種組合都試試看</div><h3>讓兩塊磁鐵的磁極慢慢靠近</h3><p class="sidenote">一塊磁鐵固定，另一塊可自由移動。先選預測，再觀察真實情況。不用碰到，也可能感覺到磁力。</p><div class="object-grid">${x.records.map((r,i)=>`<section class="item-card"><div class="item-head"><span class="item-name">第${i+1}組：${r.pair[0]} 極－${r.pair[1]} 極</span><span>🧲</span></div><div class="mini"><div><label class="small-label">我的推測</label>${selectOptions(r.prediction,[['attract','相吸'],['repel','相斥']],`data-record="${i}" data-record-field="prediction" aria-label="${r.pair}預測"`)}</div><div><label class="small-label">實際結果</label>${selectOptions(r.actual,[['attract','相吸'],['repel','相斥']],`data-record="${i}" data-record-field="actual" aria-label="${r.pair}實際結果"`)}</div></div><div><label class="small-label">觀察備註（可不填）</label><input data-record="${i}" data-record-field="note" value="${esc(r.note)}" placeholder="例如：還沒碰到就推開" maxlength="400"></div>${r.actual?`<span class="badge">${r.prediction===r.actual?'✓ 預測吻合':'✦ 觀察到新發現'}</span>`:''}</section>`).join('')}</div><div class="card peach"><strong>觀察小祕訣</strong><p>用相同大小的磁鐵，慢慢接近。可在光滑桌面上讓其中一塊容易移動，排斥的現象更清楚。注意磁鐵不要撞擊或夾到手。</p></div>`}
if(step===2){content=quizSection(3)}
if(step===3){content=`<div class="badge">✨ 任務 04｜完成磁極法則</div><div class="card mint"><h3>🧠 今天學到的科學知識</h3><p><strong>同極相斥，異極相吸。</strong></p><p>N－N、S－S 是相同磁極，彼此排斥；N－S、S－N 是不同磁極，彼此吸引。</p><p>磁力不一定需要接觸就能發生作用。</p></div><div class="table-scroll"><table class="report-table"><thead><tr><th>磁極組合</th><th>實驗預測</th><th>實測結果</th></tr></thead><tbody>${x.records.map(r=>`<tr><td>${r.pair[0]}－${r.pair[1]}</td><td>${poleTxt(r.prediction)}</td><td>${poleTxt(r.actual)}</td></tr>`).join('')}</tbody></table></div><div class="field"><label for="l3-conc">我的磁極法則</label><textarea id="l3-conc" data-input="l3.conclusion" placeholder="我發現當……，兩塊磁鐵會……">${esc(x.conclusion)}</textarea></div>`}
return content}
function poleTxt(v){return v==='repel'?'互相排斥':v==='attract'?'互相吸引':'未填'}
function quizSection(lesson){const list=QUIZZES[lesson],rec=state.quiz[lesson],answered=Object.keys(rec.answers).length,score=list.filter((q,i)=>rec.answers[i]===q.k).length;return `<div class="badge">🎯 任務 03｜知識大挑戰</div><h3>用實驗中學到的知識來解題！</h3><p class="sidenote">這裡有4題選擇題。作答後按「批改我的答案」，會看到解說。若想重做，可點「再挑戰一次」。</p>${list.map((q,i)=>`<div class="quiz-question"><h3>Q${i+1}. ${esc(q.q)}</h3><div class="quiz-options">${q.a.map((a,j)=>`<button type="button" class="quiz-choice ${rec.answers[i]===j?'chosen':''} ${rec.submitted&&j===q.k?'correct':''} ${rec.submitted&&rec.answers[i]===j&&j!==q.k?'wrong':''}" data-answer="${lesson},${i},${j}" ${rec.submitted?'disabled':''}>${'ABCD'[j]}. ${esc(a)}</button>`).join('')}</div>${rec.submitted?`<div class="feedback"><strong>${rec.answers[i]===q.k?'✅ 答對了！':`💡 正確答案：${'ABCD'[q.k]}`}</strong><br>${esc(q.why)}</div>`:''}</div>`).join('')}<div class="card ${rec.submitted?'mint':'lav'}">${rec.submitted?`<p class="score">得到 ${score} / ${list.length} 分！</p><p>分數是學習線索，不是排名；看看哪一個概念還可以再練習。</p><button class="btn purple" data-retry="${lesson}">↻ 再挑戰一次</button>`:`<strong>已作答 ${answered} / ${list.length} 題</strong><p class="sidenote">可以先完成四題，再一起核對答案。</p><button class="btn" data-submit="${lesson}" ${answered<list.length?'disabled':''}>📝 批改我的答案</button>`}</div>`}
function preview(lesson,step){return `<div class="stage-top"><div><div class="kicker">第 ${['','一','二','三'][lesson]} 節課 · 互動探究</div><h2>${LESSONS[lesson].emoji} ${LESSONS[lesson].title}</h2><p class="sub">${LESSONS[lesson].topic}</p></div><span class="lesson-color">${LESSONS[lesson].pages}</span></div>${navSteps(lesson,step)}<main>${[lesson1,lesson2,lesson3][lesson-1](step)}</main>${bottomNav(lesson,step)}`}
function reportHtml(){const p=(s)=>fmt(s);const l1=state.l1,l2=state.l2,l3=state.l3;const data=completedTrials();const avg=data.length?[0,1,2].map(j=>(data.reduce((a,r)=>a+r[j],0)/data.length).toFixed(1)):null;const quizRows=[1,2,3].map(l=>{const q=state.quiz[l],score=QUIZZES[l].filter((obj,i)=>obj.k===q.answers[i]).length;return `<tr><td>第${['','一','二','三'][l]}節課</td><td>${Object.keys(q.answers).length}/4 題</td><td>${q.submitted?`${score}/4 分`:'尚未批改'}</td></tr>`}).join('');return `<header><h1>🧲 磁力科學實驗室｜學習成果</h1><p><strong>學習者：</strong>${esc(state.meta.name||'未填姓名')}　 <strong>日期：</strong>${esc(state.meta.date)}</p><p>課程涵蓋：磁鐵能吸住的物品、磁鐵不同位置的磁力強弱、同極相斥與異極相吸。</p></header><section class="report-section tall"><h2>🔎 第一節｜磁性偵探</h2><p><strong>實驗前的想法：</strong>${p(l1.hypothesis)}</p><table class="report-table"><thead><tr><th>測試物品</th><th>材質</th><th>我的推測</th><th>實際結果</th><th>備註</th></tr></thead><tbody>${l1.items.map(i=>`<tr><td>${esc(i.name)}</td><td>${esc(i.material)}</td><td>${yesTxt(i.prediction)}</td><td>${i.actual?yesTxt(i.actual):'未填'}</td><td>${p(i.note)}</td></tr>`).join('')}</tbody></table><p><strong>令我驚訝的現象：</strong>${p(l1.reflection)}</p><p><strong>我的結論：</strong>${p(l1.conclusion)}</p></section><section class="report-section"><h2>📏 第二節｜磁力測量員</h2><p><strong>我的預測：</strong>${esc(({ends:'兩端比較多',middle:'中間比較多',same:'三個位置差不多',unsure:'還不確定'})[l2.prediction]||'未填')}</p><table class="report-table"><thead><tr><th>實驗輪次</th><th>N極</th><th>中間</th><th>S極</th></tr></thead><tbody>${l2.measure.map((r,i)=>`<tr><td>第${i+1}輪</td>${r.map(v=>`<td>${v===''?'未填':esc(v)} 個</td>`).join('')}</tr>`).join('')}${avg?`<tr><th>完整輪次平均</th>${avg.map(v=>`<td>${v} 個</td>`).join('')}</tr>`:''}</tbody></table><p><strong>實驗觀察：</strong>${p(l2.notes)}</p><p><strong>我的結論：</strong>${p(l2.conclusion)}</p></section><section class="report-section"><h2>🧲 第三節｜磁極對決</h2><table class="report-table"><thead><tr><th>磁極組合</th><th>預測</th><th>實際結果</th><th>備註</th></tr></thead><tbody>${l3.records.map(r=>`<tr><td>${esc(r.pair[0])}－${esc(r.pair[1])}</td><td>${poleTxt(r.prediction)}</td><td>${poleTxt(r.actual)}</td><td>${p(r.note)}</td></tr>`).join('')}</tbody></table><p><strong>我的結論：</strong>${p(l3.conclusion)}</p></section><section class="report-section"><h2>🏅 三節課測驗紀錄</h2><table class="report-table"><thead><tr><th>課程</th><th>作答進度</th><th>成績</th></tr></thead><tbody>${quizRows}</tbody></table></section><section class="report-section"><h2>📚 科學知識整理</h2><p>① 磁鐵可以吸住鐵製品，但不是所有金屬都能被磁鐵吸引。</p><p>② 常見長條形磁鐵的兩端磁力比較強，稱為磁極，分別是N極與S極。吸起相同迴紋針的數量可用來比較強弱。</p><p>③ 磁鐵同極相斥、異極相吸；磁力不一定需要接觸就能產生作用。</p><p class="sidenote">本成果包含學生實際輸入的觀察紀錄；未填項目保持未填，不以教材參考數字代替。</p></section>`}
function yesTxt(v){return v==='yes'?'會吸住':v==='no'?'不會吸住':'未填'}
function reportPage(){return `<div class="kicker">📚 LEARNING PORTFOLIO</div><h2>我的磁力探究成果</h2><p class="sub">三節課的預測、實測、測驗和結論，都可以帶走保存！</p><div class="grid2" style="margin-top:16px"><div class="field"><label for="studentName">學習者姓名（可留白）</label><input id="studentName" type="text" data-input="meta.name" value="${esc(state.meta.name)}" maxlength="60" placeholder="輸入你的名字"></div><div class="field"><label for="studyDate">學習日期</label><input id="studyDate" type="date" data-input="meta.date" value="${esc(state.meta.date)}"></div></div><div class="card mint"><h3>💾 四種保存方式</h3><div class="utility"><button class="btn green" id="export-html">⬇ 下載完整學習成果（HTML）</button><button class="btn purple" id="print-report">🖨 列印／另存 PDF</button><button class="btn secondary" id="export-json">📦 儲存可繼續編輯的紀錄（JSON）</button><label class="btn secondary" style="cursor:pointer;text-align:center">📂 匯入之前的紀錄（JSON）<input type="file" id="import-json" accept=".json,application/json" class="hide"></label></div><p class="sidenote">HTML 適合展示成果；JSON 是可在本網站繼續編輯的備份。PDF 可在「列印」視窗選擇「另存為 PDF」。自動保留進度只限目前瀏覽器與裝置。</p></div><details><summary>🧰 教師使用說明與課堂提醒</summary><p>網站採三節課各四步驟：問題與預測 → 真實實驗 → 知識測驗 → 結論統整。所有實驗「實際結果」都由學生輸入，網站不會幫學生編造數據。</p><p>第一節請老師檢查自訂物品安全性，不以外觀判斷所有金屬是否有磁性。第二節保持磁鐵、迴紋針和操作條件一致。第三節磁極示意動畫只表示物理作用方向，不代表實驗已完成。</p><p>可在離線狀態使用，不需要帳號、不會上傳學生資料到伺服器。不同裝置之間可用 JSON 備份傳遞。</p></details><div class="card peach"><strong>清空資料</strong><p class="sidenote">要讓下一位學生重新開始時，可以清除目前紀錄。清除前請先下載備份。</p><button class="btn warn" id="clear-all">🗑 清除全部紀錄</button></div><h3 style="margin-top:24px">🗂 完整學習成果預覽</h3><div class="card" id="report-preview">${reportHtml()}</div>`}
function render(){const lesson=state.ui.lesson,step=state.ui.step;document.getElementById('app').innerHTML=`<header class="hero"><div><span class="eyebrow">MAGNET SCIENCE LAB · INTERACTIVE LEARNING</span><h1>🧲 磁力科學實驗室</h1><p class="sub">三節課 · 真實實驗 × 互動測驗 × 科學小發現</p></div>${heroSVG()}</header><div class="layout">${sidebar()}<section class="stage">${lesson===4?reportPage():preview(lesson,step)}</section></div><div class="footer">以國小三年級「磁力有什麼特性」為學習核心｜所有觀察結果以真實實驗為準</div>`}
function updateProgressUI(){const el=document.getElementById('percent'),bar=document.getElementById('progress-fill');if(el)el.textContent=progress()+'%';if(bar)bar.style.width=progress()+'%'}
function inputHandler(e){const t=e.target,field=t.dataset.input;if(field){const [a,b]=field.split('.');if(state[a]&&Object.prototype.hasOwnProperty.call(state[a],b)){state[a][b]=t.value;save();updateProgressUI();return}}const id=t.dataset.itemId;if(id){const itm=state.l1.items.find(x=>x.id===id);if(itm&&['material','prediction','actual','note'].includes(t.dataset.itemField)){itm[t.dataset.itemField]=t.value;save();updateProgressUI();if(t.tagName==='SELECT')render();return}}if(t.dataset.measure){const [i,j]=t.dataset.measure.split(',').map(Number);if(!Number.isInteger(i)||!Number.isInteger(j))return;const value=t.value; if(value!==''&&(!/^\d+$/.test(value)||Number(value)>999)){notify('請輸入0至999的整數');return}state.l2.measure[i][j]=value;save();updateProgressUI();if(e.type==='change')render();return}if(t.dataset.record){const i=Number(t.dataset.record);const r=state.l3.records[i];if(r&&['prediction','actual','note'].includes(t.dataset.recordField)){r[t.dataset.recordField]=t.value;save();updateProgressUI();if(t.tagName==='SELECT')render();return}}if(t.dataset.fair!==undefined){state.l2.fair[Number(t.dataset.fair)]=t.checked;save();return}if(t.name==='l2-pred'){state.l2.prediction=t.value;save();render();return}if(t.name==='l3-demo-pred'){state.l3.demoPrediction=t.value;state.l3.demoReveal=false;save();render();return}if(t.dataset.demo==='pair'){state.l3.demoPair=t.value;state.l3.demoPrediction='';state.l3.demoReveal=false;save();render();return}}
function makeFile(content,filename,type){const b=new Blob([content],{type:type||'text/html;charset=utf-8'});const url=URL.createObjectURL(b);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function fileName(suffix){const name=(state.meta.name||'學習者').replace(/[\\/:*?"<>|\r\n]/g,'').slice(0,30)||'學習者';return `磁力科學實驗室_${name}_${state.meta.date||localDay()}.${suffix}`}
function reportDocument(){return '<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>磁力科學實驗室｜學習成果</title><style>body{font-family:system-ui,\'Microsoft JhengHei\',sans-serif;line-height:1.6;max-width:900px;margin:30px auto;padding:18px;color:#2b3855}h1{color:#436eb7}h2{margin-top:34px;border-bottom:3px solid #d8e7ff;padding-bottom:7px}h3{background:#f2f6ff;padding:8px;border-radius:8px}.report-table{border-collapse:collapse;width:100%;font-size:14px;margin:12px 0}.report-table th,.report-table td{border:1px solid #cad6e7;padding:8px;text-align:left;vertical-align:top}.report-table th{background:#eaf1fc}.report-section{page-break-inside:auto}.sidenote{font-size:13px;color:#65738a}@media print{body{padding:0;margin:0}h2{page-break-after:avoid}.report-section{break-inside:avoid-page}.report-section.tall{break-inside:auto}}</style></head><body>'+reportHtml()+'</body></html>'}
async function importJSON(file){if(!file)return;if(file.size>3e6){notify('檔案太大，請使用本網站匯出的 JSON 紀錄');return}try{const raw=JSON.parse(await file.text());if(raw.version!==2||!raw.l1||!raw.l2||!raw.l3||!raw.quiz)throw Error('格式不符合');if(!confirm('匯入將覆蓋目前瀏覽器的紀錄。確定要匯入嗎？'))return;state=normalize(raw);save();render();notify('✅ 已載入之前的紀錄')}catch(e){notify('匯入失敗：請選擇本網站匯出的 JSON 檔案')}}

document.addEventListener('click',e=>{const target=e.target.closest('button');if(!target)return;if(target.dataset.page){setPage(Number(target.dataset.page));return}if(target.dataset.step!==undefined){setPage(state.ui.lesson,Number(target.dataset.step));return}if(target.id==='add-item'){const name=state.l1.extraName.trim(),material=state.l1.extraMaterial.trim();if(!name){notify('請先輸入新物品的名稱');return}if(state.l1.items.length>=60){notify('已達到60項上限');return}state.l1.items.push({id:'custom-'+Date.now()+'-'+state.l1.items.length,icon:'🧩',name,material,reference:'自訂物品不提供固定答案，請以實測與材質為準。',prediction:'',actual:'',note:'',custom:true});state.l1.extraName='';state.l1.extraMaterial='';save();render();notify('已加入新的測試物品');return}if(target.dataset.deleteItem){if(!confirm('確定要刪除這項自訂測試物品嗎？'))return;state.l1.items=state.l1.items.filter(x=>x.id!==target.dataset.deleteItem);save();render();return}if(target.dataset.answer){const [l,i,j]=target.dataset.answer.split(',').map(Number);if(state.quiz[l].submitted)return;state.quiz[l].answers[i]=j;save();render();return}if(target.dataset.submit){const l=Number(target.dataset.submit);if(Object.keys(state.quiz[l].answers).length<4){notify('先完成4題再批改喔');return}state.quiz[l].submitted=true;save();render();return}if(target.dataset.retry){const l=Number(target.dataset.retry);state.quiz[l]={answers:{},submitted:false};save();render();return}if(target.id==='play-demo'){if(!state.l3.demoPrediction){notify('先猜一猜，再看示意');return}state.l3.demoReveal=true;save();render();return}if(target.id==='export-html'){makeFile(reportDocument(),fileName('html'),'text/html;charset=utf-8');notify('已下載學習成果 HTML');return}if(target.id==='export-json'){makeFile(JSON.stringify(state,null,2),fileName('json'),'application/json;charset=utf-8');notify('已下載可重新匯入的紀錄');return}if(target.id==='print-report'){document.getElementById('print-sheet').innerHTML=reportHtml();window.print();return}if(target.id==='clear-all'){if(confirm('確定清除所有課程的預測、實驗紀錄、結論和測驗答案嗎？這個動作無法復原。')){state=createState();save();setPage(1);notify('已重設，準備開始新的磁力探究')}}});
document.addEventListener('change',e=>{if(e.target.id==='import-json')importJSON(e.target.files?.[0])});
window.addEventListener('afterprint',()=>{document.getElementById('print-sheet').innerHTML=''});
save();render();
</script>
</body>
</html>
