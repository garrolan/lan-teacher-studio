<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>瓦斯危機！家庭安全大冒險</title>
<style>
:root{--ink:#2f3b59;--blue:#5a78a8;--gold:#ffe27a;--paper:#fff8dc;--line:#314663;--green:#a9e9a7;--red:#ffc0ba}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:10px;background:linear-gradient(#95dcff 0 60%,#79bd78 60%);font-family:"Microsoft JhengHei",system-ui,sans-serif;color:var(--ink)}
#game{width:min(1100px,100%);min-height:690px;background:#fff3c7;border:6px solid var(--line);box-shadow:0 9px 0 #203249,0 20px 40px #0004;overflow:hidden}
.top{height:64px;background:#46628f;color:#fff;border-bottom:6px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 16px;gap:12px}.title{font-size:clamp(18px,3vw,29px);font-weight:900}.score{background:#fff0a7;color:var(--ink);border:3px solid var(--line);padding:7px 10px;box-shadow:3px 3px 0 #203249;font-weight:900;white-space:nowrap}
.scene{height:395px;position:relative;overflow:hidden;border-bottom:6px solid var(--line)}.living{background:linear-gradient(#bfe9ff 0 58%,#e8ca93 58%)}.kitchen{background:linear-gradient(#ffd8ad 0 64%,#ad755d 64%)}.outside{background:linear-gradient(#bfe9ff 0 62%,#71b873 62%)}
.house{position:absolute;width:540px;height:250px;left:50%;bottom:25px;transform:translateX(-50%);background:#ffe2a5;border:6px solid #6f4e46}.roof{position:absolute;left:-30px;right:-30px;top:-74px;height:80px;background:#e96c5d;border:6px solid #6f4e46;clip-path:polygon(50% 0,100% 100%,0 100%)}.door{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:95px;height:135px;background:#98644d;border:6px solid #6f4e46}.win{position:absolute;top:55px;width:90px;height:72px;background:#9ce0ff;border:6px solid #6f4e46}.w1{left:60px}.w2{right:60px}.win:before,.win:after{content:"";position:absolute;background:#6f4e46}.win:before{width:6px;height:100%;left:36px}.win:after{height:6px;width:100%;top:28px}
.kset{position:absolute;left:45px;right:45px;bottom:28px;height:210px;background:#f4d1a7;border:6px solid #6f4e46}.counter{position:absolute;left:0;right:0;bottom:0;height:72px;background:#a86348;border-top:6px solid #6f4e46}.stove{position:absolute;left:170px;bottom:70px;width:170px;height:96px;background:#d9dce3;border:6px solid #6f4e46}.tank{position:absolute;left:55px;bottom:70px;width:65px;height:92px;border:6px solid #6f4e46;background:#f5f5f5;border-radius:10px}.cab{position:absolute;right:80px;top:15px;width:125px;height:132px;border:6px solid #6f4e46;background:#f4ad52}.smell{position:absolute;font-size:43px;animation:float 1.3s infinite ease-in-out}.s1{left:290px;top:45px}.s2{left:365px;top:75px;animation-delay:.25s}.s3{left:435px;top:38px;animation-delay:.5s}@keyframes float{50%{transform:translateY(-10px)}}
.char{position:absolute;bottom:20px;width:105px;text-align:center;filter:drop-shadow(4px 4px 0 #31466344)}.c1{left:11%}.c2{left:44%}.c3{right:10%}.face{font-size:70px}.tag{display:inline-block;padding:3px 7px;background:#fff9df;border:3px solid var(--line);box-shadow:2px 2px 0 #203249;font-weight:900}
.warn{position:absolute;right:24px;top:22px;max-width:245px;background:#fff0a7;border:4px solid var(--line);box-shadow:4px 4px 0 #203249;padding:10px 12px;font-weight:900}
.dialog{padding:15px 18px 18px;background:#fff9e8}.speaker{font-size:18px;font-weight:900;color:#46628f;margin-bottom:6px}.line{min-height:76px;background:#fff;border:4px solid var(--line);box-shadow:4px 4px 0 #203249;padding:12px 14px;font-size:18px;line-height:1.55}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.choice,.next,.again{border:4px solid var(--line);box-shadow:4px 4px 0 #203249;background:#ffe59d;color:var(--ink);font-weight:900;cursor:pointer;padding:11px;font-size:16px}.choice:hover,.next:hover,.again:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 #203249}.choice.good{background:var(--green)}.choice.bad{background:var(--red)}.feedback{display:none;margin-top:10px;background:#fff;border:4px solid var(--line);padding:10px 12px;font-weight:800;line-height:1.5}.feedback.show{display:block}.controls{text-align:right;margin-top:10px}.next{background:#8ed4ff}.next:disabled{opacity:.45;cursor:not-allowed}
.end{position:absolute;inset:28px;background:#fff8dff2;border:6px solid var(--line);box-shadow:7px 7px 0 #203249;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px}.end h1{font-size:clamp(30px,5vw,50px);margin:0 0 10px;color:#46628f}.rules{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;width:100%;margin:18px 0}.rule{background:#fff;border:5px solid var(--line);box-shadow:5px 5px 0 #203249;padding:14px}.big{font-size:44px;font-weight:1000;color:#46628f}.rule p{font-weight:900;line-height:1.45}.mini{font-size:13px;opacity:.8}
@media(max-width:760px){#game{min-height:810px}.scene{height:340px}.choices{grid-template-columns:1fr}.char{transform:scale(.8);transform-origin:bottom}.c1{left:1%}.c2{left:35%}.c3{right:1%}.warn{font-size:12px;max-width:180px}.rules{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="game">
  <div class="top"><div class="title">🏠 瓦斯危機！家庭安全大冒險</div><div class="score" id="score">安全星星：0 ⭐</div></div>
  <div id="screen"></div>
</div>
<script>
const data=[
{bg:"living",sp:"旁白",tx:"星期六下午，小南和家人在客廳休息。忽然，一股奇怪的味道從廚房飄了出來……",warn:"姐姐：『咦？是不是瓦斯味？』",cs:[["A. 打開廚房的燈，看清楚一點！",0,"⚠️ 不行！開關電器可能產生火花。如果空氣中已有瓦斯，會增加危險。"],["B. 先不要碰任何電器，提醒大家可能有瓦斯外洩。",1,"✅ 做得好！第一步先避免開關電器。記住：『禁』！"],["C. 拿手機進廚房開手電筒查看。",0,"⚠️ 不建議！先不要在可能有瓦斯的空間操作電器。"]]},
{bg:"kitchen",sp:"媽媽",tx:"『真的有瓦斯味！我們現在怎麼辦？』姐姐想趕快把味道吹掉。",warn:"廚房裡的味道越來越明顯……",cs:[["A. 打開抽油煙機，把味道抽出去。",0,"⚠️ 危險！不要啟動抽油煙機、電風扇等電器。"],["B. 在安全且可操作的情況下，關閉瓦斯開關。",1,"✅ 正確！先讓瓦斯停止繼續外洩。記住：『關』！"],["C. 點一根蠟燭確認是不是瓦斯味。",0,"🚫 絕對不可以！明火遇到瓦斯可能造成火災或爆炸。"]]},
{bg:"kitchen",sp:"姐姐",tx:"『瓦斯已經關掉了，可是屋子裡還有味道耶！』現在要怎麼讓空氣流通？",warn:"提示：不要使用電器通風。",cs:[["A. 用力把門窗撞開，越快越好。",0,"⚠️ 太用力碰撞可能不安全。應以輕柔方式處理。"],["B. 輕輕推開門窗，讓空氣自然流通。",1,"✅ 沒錯！輕輕推開門窗自然通風。記住：『推』！"],["C. 打開電風扇對著窗戶吹。",0,"⚠️ 不要啟動電風扇。瓦斯外洩時應避免操作電器。"]]},
{bg:"outside",sp:"媽媽",tx:"『味道還是很重，我有點擔心。』姐姐提議留下來找是哪一條管子漏氣。",warn:"最後一關：現在最重要的是人身安全！",cs:[["A. 全家留下來自己找漏氣的位置。",0,"⚠️ 不要逗留在危險空間。應先確保人員安全。"],["B. 全家離開屋內，到戶外安全處再求助。",1,"✅ 完成！先離開危險區域，到戶外安全處，再視情況撥打 119。記住：『離』！"],["C. 躲進房間，把門關起來等味道散掉。",0,"⚠️ 不行。留在屋內仍可能持續暴露在危險中。"]]}
];
let i=0,score=0,locked=false;
function chars(){return '<div class="char c1"><div class="face">👧</div><div class="tag">小南</div></div><div class="char c2"><div class="face">👩</div><div class="tag">媽媽</div></div><div class="char c3"><div class="face">🧑‍🦰</div><div class="tag">姐姐</div></div>'}
function background(bg,w){if(bg==="kitchen")return `<div class="scene kitchen"><div class="kset"><div class="tank"></div><div class="stove"></div><div class="cab"></div><div class="counter"></div><div class="smell s1">〰️</div><div class="smell s2">〰️</div><div class="smell s3">〰️</div></div>${chars()}<div class="warn">${w}</div></div>`;return `<div class="scene ${bg}"><div class="house"><div class="roof"></div><div class="win w1"></div><div class="win w2"></div><div class="door"></div></div>${chars()}<div class="warn">${w}</div></div>`}
function render(){locked=false;let s=data[i];let bs=s.cs.map((x,n)=>`<button class="choice" onclick="pick(${n})">${x[0]}</button>`).join("");document.getElementById("screen").innerHTML=background(s.bg,s.warn)+`<div class="dialog"><div class="speaker">${s.sp}</div><div class="line">${s.tx}</div><div class="choices">${bs}</div><div id="fb" class="feedback"></div><div class="controls"><button id="nx" class="next" onclick="next()" disabled>繼續冒險 ▶</button></div></div>`;showScore()}
function showScore(){document.getElementById("score").textContent=`安全星星：${score} ⭐`}
function pick(n){if(locked)return;locked=true;let s=data[i],c=s.cs[n],buttons=[...document.querySelectorAll(".choice")];buttons.forEach((b,j)=>{b.disabled=true;if(s.cs[j][1])b.classList.add("good");if(j===n&&!c[1])b.classList.add("bad")});if(c[1])score++;let f=document.getElementById("fb");f.textContent=c[2];f.classList.add("show");document.getElementById("nx").disabled=false;showScore()}
function next(){if(i<data.length-1){i++;render()}else rules()}
function rules(){document.getElementById("screen").innerHTML=`<div class="scene outside"><div class="end"><h1>🛡️ 終極安全密碼</h1><div style="font-size:35px;font-weight:1000">禁　關　推　離</div><p style="font-size:20px;font-weight:900">你能把四個字的意思全部說出來嗎？</p><div class="rules"><div class="rule"><div class="big">禁</div><p>禁止開關電器<br>避免火花</p></div><div class="rule"><div class="big">關</div><p>安全可行時<br>關閉瓦斯</p></div><div class="rule"><div class="big">推</div><p>輕推門窗<br>自然通風</p></div><div class="rule"><div class="big">離</div><p>離開現場<br>到戶外求助</p></div></div><button class="next" onclick="finish()">查看任務結果 ▶</button></div></div>`}
function finish(){let m=score===4?"太厲害了！你是家庭安全小隊長！":score>=2?"做得不錯！再把『禁、關、推、離』記熟一點吧！":"沒關係，安全知識就是要多練習！";document.getElementById("screen").innerHTML=`<div class="scene outside"><div class="end"><h1>🎉 任務完成！</h1><div style="font-size:35px">${"⭐".repeat(score)}${"☆".repeat(4-score)}</div><p style="font-size:22px;font-weight:900">${m}</p><p style="font-size:18px;line-height:1.7">你不是打敗了怪物，<br>而是學會在危險發生時，讓家人更安全。</p><div class="score" style="margin:10px">最重要的四個字：禁・關・推・離</div><button class="again" onclick="reset()">再玩一次 ↻</button><p class="mini">教學提醒：若現場瓦斯味濃、情況不明或無法安全操作，優先離開並到戶外安全處求助。</p></div></div>`}
function reset(){i=0;score=0;render()}
render();
</script>
</body></html>
