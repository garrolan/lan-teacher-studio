function choose(i,b){if(answered)return;answered=true;let q=deck[pos],ok=i===q.answer;if(ok)correct++;answers.push({q,i,ok});for(const btn of $('choices').children){btn.disabled=true;if(Number(btn.dataset.index)===q.answer){btn.classList.add('correct');btn.querySelector('.letter').textContent='✓'}}if(!ok){b.classList.add('wrong');b.querySelector('.letter').textContent='×'}$('points').textContent=`⭐ 答對 ${correct} 題`;$('bar').style.width=`${(pos+1)/deck.length*100}%`;document.querySelector('.track').setAttribute('aria-valuenow',Math.round((pos+1)/deck.length*100));$('feedback').classList.toggle('bad',!ok);$('feedbackTitle').textContent=ok?'答對了！線索破解成功！':'差一點！來看看正確線索';$('explain').textContent=(ok?'':`正確答案：${q.options[q.answer]}。`)+q.why;$('feedback').hidden=false;$('next').textContent=pos===deck.length-1?'查看偵探成績 →':'下一題 →';$('next').hidden=false;play(ok);$('next').focus({preventScroll:true});if(window.innerWidth<600)$('feedback').scrollIntoView({block:'nearest',behavior:'smooth'})}
function play(ok){if(!sound)return;try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let now=audio.currentTime;let notes=ok?[523,659,784]:[392,330];notes.forEach((f,i)=>{let o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.001,now+i*.11);g.gain.exponentialRampToValueAtTime(.09,now+i*.11+.02);g.gain.exponentialRampToValueAtTime(.001,now+i*.11+.15);o.connect(g);g.connect(audio.destination);o.start(now+i*.11);o.stop(now+i*.11+.16)})}catch(e){}}
function finish(){show('result');let ratio=correct/deck.length,miss=answers.filter(a=>!a.ok);$('medal').textContent=ratio===1?'🏆':ratio>=.75?'🏅':'🔎';$('rank').textContent=ratio===1?'粉末偵探大師！':ratio>=.75?'出色的廚房偵探！':'偵探見習生，繼續探索！';$('finalScore').textContent=`${correct} / ${deck.length}`;$('resultText').textContent=ratio===1?'所有線索都破解了！':`答對率 ${Math.round(ratio*100)}%，還有 ${miss.length} 個線索可以再研究。`;$('retry').hidden=!miss.length;$('retry').onclick=()=>begin(miss.map(a=>a.q),'retry');$('stats').replaceChildren();Object.keys(categories).forEach(k=>{let a=answers.filter(x=>x.q.cat===k);if(!a.length)return;let d=document.createElement('div');d.className='stat';let b=document.createElement('b');b.textContent=`${a.filter(x=>x.ok).length} / ${a.length}`;d.append(b,document.createTextNode(categories[k].icon+' '+categories[k].name));$('stats').append(d)});$('review').hidden=!miss.length;$('reviewList').replaceChildren();miss.forEach(a=>{let d=document.createElement('details'),s=document.createElement('summary'),p=document.createElement('p');s.textContent=a.q.question;p.textContent=`你的答案：${a.q.options[a.i]}。 正確答案：${a.q.options[a.q.answer]}。 ${a.q.why}`;d.append(s,p);$('reviewList').append(d)})}
$('next').onclick=()=>{if(!answered)return;if(++pos>=deck.length)finish();else render()};$('all').onclick=()=>begin(Q,'all');$('again').onclick=()=>begin(lastDeck,mode);$('back').onclick=()=>show('start');$('home').onclick=()=>{if(!$('game').hidden&&answers.length&& !confirm('回首頁會結束這次挑戰，確定嗎？'))return;show('start')};$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'🔊 音效':'🔇 音效';$('sound').setAttribute('aria-pressed',sound);if(sound)play(true)};Object.entries(categories).forEach(([k,v])=>{let b=document.createElement('button');b.className='mode';let e=document.createElement('span');e.className='emoji';e.textContent=v.icon;let t=document.createElement('span'),h=document.createElement('b'),s=document.createElement('small');h.textContent=v.name+' · 6 題';s.textContent=v.desc;t.append(h,s);b.append(e,t);b.onclick=()=>begin(Q.filter(q=>q.cat===k),k);$('modes').append(b)});document.addEventListener('keydown',e=>{if($('game').hidden)return;if(!answered&&/^[1-4]$/.test(e.key)){let b=$('choices').children[Number(e.key)-1];if(b)b.click()}else if(answered&&e.key==='Enter'&&document.activeElement!==$('next')){$('next').click()}});
</script></body></html>
